<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catálogo de filmes</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Catálogo de filmes</h1>
        <p>Encontre seus filmes favoritos</p>
    </header>

    <main>

        <section class="cadastro">

            <h2>Adicionar filme</h2>

            <form id="form-filme">

                <input
                    type="text"
                    id="titulo"
                    placeholder="Título"
                    required
                >

                <input
                    type="text"
                    id="diretor"
                    placeholder="Diretor"
                    required
                >

                <input
                    type="text"
                    id="genero"
                    placeholder="Gênero"
                    required
                >

                <input
                    type="number"
                    id="ano"
                    placeholder="Ano"
                    required
                >

                <input
                    type="number"
                    id="duracao"
                    placeholder="Duração em minutos"
                    required
                >

                <input
                    type="number"
                    id="nota"
                    placeholder="Nota"
                    step="0.1"
                    min="0"
                    max="10"
                    required
                >

                <button type="submit">
                    Adicionar filme
                </button>

            </form>

        </section>


        <section>

            <h2>Filmes</h2>

            <div class="filmes" id="lista-filmes">

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
